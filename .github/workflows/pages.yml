name: Deploy GitHub Pages

# 发布 Testing- 的三个作品。
#
# 两种发布方式都支持，选一种即可：
#   A. 仓库 Settings → Pages → Source = "Deploy from a branch"，分支 main、目录 /(root)。
#      直接发布仓库里已经提交好的内容，不需要这个 workflow。
#   B. 仓库 Settings → Pages → Source = "GitHub Actions"，由这个 workflow 发布。
#      它会用 sources/lina/ 的源码重新构建 LINA，而不是直接用仓库里那份 lina/。
#
# 无论哪种方式，LINA 的构建基础路径都必须是 /Testing-/lina/（见 sources/lina/vite.config.ts）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次发布；正在跑的发布不打断，避免把 Pages 停在中间状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sources/lina/package-lock.json

      - name: 安装 LINA 构建依赖
        working-directory: sources/lina
        run: npm ci

      - name: 构建 LINA（base = /Testing-/lina/）
        working-directory: sources/lina
        run: npm run build

      - name: 组装站点
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r camille calendar _site/
          cp -r sources/lina/dist _site/lina

      - name: 校验资源路径已跟随 base 重写
        run: |
          set -euo pipefail
          # index.html 里不允许再出现站点根绝对路径；否则会打到域名根上 404
          if grep -nP '(href|src)="/(?!Testing-/lina/)' _site/lina/index.html; then
            echo "::error::lina/index.html 仍有未加 base 的根绝对路径"
            exit 1
          fi
          for f in _site/index.html _site/camille/index.html _site/calendar/index.html _site/lina/index.html; do
            test -s "$f" || { echo "::error::缺少 $f"; exit 1; }
          done
          # index.html 预加载的首屏图必须真实存在于产物里
          grep -oE '/Testing-/lina/assets/[A-Za-z0-9_./-]+\.webp' _site/lina/index.html |
            sed 's#^/Testing-/lina/#_site/lina/#' | sort -u |
            while read -r p; do
              test -f "$p" || { echo "::error::预加载资源缺失：$p"; exit 1; }
            done
          echo "资源路径校验通过"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
